<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>商户入网申请平台 · 原型</title>
<style>
  :root {
    --primary: #1677ff;
    --primary-hover: #4096ff;
    --primary-active: #0958d9;
    --sidebar-bg: #001529;
    --sidebar-width: 220px;
    --header-h: 56px;
    --banner-h: 32px;
    --border: #f0f0f0;
    --text: rgba(0,0,0,.88);
    --text-secondary: rgba(0,0,0,.45);
    --success: #52c41a;
    --warning: #faad14;
    --error: #ff4d4f;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px; color: var(--text); background: #f5f5f5; min-height: 100vh;
  }
  a { color: var(--primary); text-decoration: none; cursor: pointer; }
  a:hover { color: var(--primary-hover); }
  .demo-banner {
    position: fixed; top: 0; left: 0; right: 0; height: var(--banner-h);
    background: linear-gradient(90deg, #fff7e6, #fff1b8);
    border-bottom: 1px solid #ffe58f; color: #ad6800; font-size: 12px;
    display: flex; align-items: center; justify-content: center; gap: 8px; z-index: 1000;
  }
  .demo-banner .tag { background: #faad14; color: #fff; padding: 1px 6px; border-radius: 3px; font-weight: 600; }
  .layout { display: flex; padding-top: var(--banner-h); min-height: 100vh; }
  .sidebar {
    width: var(--sidebar-width); background: var(--sidebar-bg); color: rgba(255,255,255,.65);
    position: fixed; top: var(--banner-h); left: 0; bottom: 0;
    display: flex; flex-direction: column; z-index: 100;
  }
  .logo {
    height: var(--header-h); display: flex; align-items: center; gap: 10px;
    padding: 0 16px; color: #fff; font-size: 15px; font-weight: 600;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .logo-mark {
    width: 28px; height: 28px; border-radius: 6px; background: var(--primary);
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0;
  }
  .logo-sub { font-size: 11px; color: rgba(255,255,255,.45); font-weight: 400; margin-top: 1px; }
  .menu { padding: 8px 0 24px; flex: 1; overflow-y: auto; }
  .menu-group-title { padding: 10px 20px 4px; font-size: 12px; color: rgba(255,255,255,.35); }
  .menu-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 20px;
    cursor: pointer; transition: all .15s; border-right: 3px solid transparent;
  }
  .menu-item:hover { color: #fff; background: rgba(255,255,255,.06); }
  .menu-item.active { color: #fff; background: var(--primary); }
  .menu-item .icon { width: 16px; text-align: center; opacity: .85; font-size: 13px; }
  .main { margin-left: var(--sidebar-width); flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .header {
    height: var(--header-h); background: #fff; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    position: sticky; top: var(--banner-h); z-index: 50;
  }
  .breadcrumb { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); }
  .breadcrumb .curr { color: var(--text); }
  .header-right { display: flex; align-items: center; gap: 16px; color: var(--text-secondary); font-size: 13px; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 12px;
  }
  .content { padding: 16px 24px 40px; }
  .card { background: #fff; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 16px; }
  .card-body { padding: 16px 24px; }
  .card-hd { padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .card-hd h3 { font-size: 15px; font-weight: 600; }
  .filter-row { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; }
  .filter-item { display: flex; flex-direction: column; gap: 4px; }
  .filter-item label { font-size: 12px; color: var(--text-secondary); }
  .filter-actions { margin-left: auto; display: flex; gap: 8px; align-items: flex-end; }
  .input, .select {
    height: 32px; padding: 4px 11px; border: 1px solid #d9d9d9; border-radius: 6px;
    font-size: 14px; outline: none; background: #fff; min-width: 160px;
    transition: border-color .2s, box-shadow .2s;
  }
  .input:focus, .select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,.15); }
  .input.block, .select.block { width: 100%; min-width: 0; }
  .textarea {
    width: 100%; min-height: 72px; padding: 8px 11px; border: 1px solid #d9d9d9; border-radius: 6px;
    font-size: 14px; font-family: inherit; resize: vertical; outline: none;
  }
  .textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,.15); }
  .btn {
    height: 32px; padding: 0 15px; border-radius: 6px; border: 1px solid #d9d9d9;
    background: #fff; color: var(--text); font-size: 14px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: all .2s; white-space: nowrap;
  }
  .btn:hover { color: var(--primary); border-color: var(--primary); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
  .btn-link { border: none; background: transparent; color: var(--primary); padding: 0 4px; height: auto; }
  .btn-link:hover { color: var(--primary-hover); }
  .btn-lg { height: 36px; padding: 0 20px; }
  .btn-sm { height: 26px; padding: 0 10px; font-size: 12px; }
  .table-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 12px; }
  .table-wrap { overflow-x: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.data th {
    background: #fafafa; text-align: left; font-weight: 500; padding: 12px 16px;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.data td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.data tr:hover td { background: #fafafa; }
  table.data tr.clickable { cursor: pointer; }
  .tag {
    display: inline-flex; align-items: center; padding: 0 7px; height: 22px; border-radius: 4px;
    font-size: 12px; border: 1px solid transparent; white-space: nowrap;
  }
  .tag-blue { background: #e6f4ff; color: #1677ff; border-color: #91caff; }
  .tag-green { background: #f6ffed; color: #389e0d; border-color: #b7eb8f; }
  .tag-orange { background: #fff7e6; color: #d46b08; border-color: #ffd591; }
  .tag-red { background: #fff2f0; color: #cf1322; border-color: #ffccc7; }
  .tag-default { background: #fafafa; color: rgba(0,0,0,.65); border-color: #d9d9d9; }
  .tag-purple { background: #f9f0ff; color: #531dab; border-color: #d3adf7; }
  .tag-cyan { background: #e6fffb; color: #08979c; border-color: #87e8de; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
  .stat {
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; cursor: pointer; transition: box-shadow .2s;
  }
  .stat:hover { box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .stat .n { font-size: 28px; font-weight: 600; line-height: 1.2; }
  .stat .l { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
  .stat.warn .n { color: #d46b08; }
  .stat.danger .n { color: #cf1322; }
  .stat.info .n { color: var(--primary); }
  .stat.ok .n { color: #389e0d; }
  .hint {
    background: #e6f4ff; border: 1px solid #91caff; color: #0958d9;
    border-radius: 6px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; line-height: 1.6;
  }
  .hint.warn { background: #fffbe6; border-color: #ffe58f; color: #ad6800; }
  .kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; }
  .kv-grid.col3 { grid-template-columns: 1fr 1fr 1fr; }
  .kv { display: flex; flex-direction: column; gap: 4px; }
  .kv .k { font-size: 12px; color: var(--text-secondary); }
  .kv .v { font-size: 14px; }
  .material-list { display: flex; flex-direction: column; gap: 10px; }
  .material-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    border: 1px solid var(--border); border-radius: 6px; background: #fafafa;
  }
  .material-row.reused { background: #f6ffed; border-color: #b7eb8f; }
  .material-row.missing { background: #fff2f0; border-color: #ffccc7; }
  .material-row.expire { background: #fffbe6; border-color: #ffe58f; }
  .material-row .name { flex: 1; font-weight: 500; }
  .material-row .meta { font-size: 12px; color: var(--text-secondary); }
  .channel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .channel-card { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff; }
  .channel-card .hd {
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
    background: #fafafa; border-bottom: 1px solid var(--border);
  }
  .channel-card .bd { padding: 14px 16px; }
  .channel-card.blocked { border-color: #ffccc7; }
  .channel-card.blocked .hd { background: #fff2f0; }
  .channel-card.done { border-color: #b7eb8f; }
  .channel-card.done .hd { background: #f6ffed; }
  .timeline { display: flex; gap: 0; margin: 8px 0 20px; overflow-x: auto; padding-bottom: 4px; }
  .tl-step { flex: 1; min-width: 86px; text-align: center; position: relative; }
  .tl-step::before {
    content: ""; position: absolute; top: 10px; left: 0; right: 0; height: 2px; background: #e8e8e8; z-index: 0;
  }
  .tl-step:first-child::before { left: 50%; }
  .tl-step:last-child::before { right: 50%; }
  .tl-dot {
    width: 20px; height: 20px; border-radius: 50%; margin: 0 auto 8px; position: relative; z-index: 1;
    background: #fff; border: 2px solid #d9d9d9;
  }
  .tl-step.done .tl-dot { background: var(--primary); border-color: var(--primary); }
  .tl-step.current .tl-dot { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(22,119,255,.15); }
  .tl-step.done::before, .tl-step.current::before { background: #91caff; }
  .tl-label { font-size: 12px; color: var(--text-secondary); }
  .tl-step.current .tl-label { color: var(--primary); font-weight: 600; }
  .tl-step.done .tl-label { color: var(--text); }
  .kanban { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start; }
  .col { background: #fafafa; border: 1px solid var(--border); border-radius: 8px; min-width: 200px; flex: 1; }
  .col-hd { padding: 10px 12px; font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; }
  .col-bd { padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 80px; }
  .kcard {
    background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px;
    cursor: pointer; font-size: 13px;
  }
  .kcard:hover { border-color: var(--primary); }
  .kcard .t { font-weight: 600; margin-bottom: 6px; }
  .kcard .s { color: var(--text-secondary); font-size: 12px; margin-bottom: 6px; }
  .steps { display: flex; justify-content: space-between; margin-bottom: 24px; position: relative; padding: 0 8px; }
  .steps::before { content: ""; position: absolute; top: 14px; left: 40px; right: 40px; height: 1px; background: #e8e8e8; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; z-index: 1; flex: 1; cursor: pointer; }
  .step-dot {
    width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 1px solid #d9d9d9;
    display: flex; align-items: center; justify-content: center; font-size: 13px; color: rgba(0,0,0,.45); font-weight: 500;
  }
  .step.active .step-dot { background: var(--primary); border-color: var(--primary); color: #fff; }
  .step.done .step-dot { background: #fff; border-color: var(--primary); color: var(--primary); }
  .step-label { font-size: 12px; color: rgba(0,0,0,.45); }
  .step.active .step-label { color: var(--primary); font-weight: 500; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; margin-bottom: 8px; }
  .form-item { display: flex; flex-direction: column; gap: 6px; }
  .form-item.full { grid-column: 1 / -1; }
  .form-label { font-size: 14px; display: flex; align-items: center; gap: 2px; }
  .form-label .req { color: var(--error); margin-right: 2px; }
  .form-hint { font-size: 12px; color: var(--text-secondary); }
  .checkbox, .radio { display: inline-flex; align-items: flex-start; gap: 8px; cursor: pointer; }
  .checkbox input, .radio input { accent-color: var(--primary); margin-top: 3px; }
  .chan-pick {
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .chan-opt {
    flex: 1; min-width: 240px; border: 1px solid #d9d9d9; border-radius: 8px; padding: 14px 16px;
    cursor: pointer; background: #fff;
  }
  .chan-opt:hover { border-color: var(--primary); }
  .chan-opt.on { border-color: var(--primary); background: #e6f4ff; }
  .chan-opt .ttl { font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .chan-opt .desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1100;
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff; border-radius: 8px; width: 860px; max-width: 100%;
    max-height: calc(100vh - 48px); display: flex; flex-direction: column;
    box-shadow: 0 6px 16px rgba(0,0,0,.08), 0 9px 28px 8px rgba(0,0,0,.05);
  }
  .modal-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-close { width: 28px; height: 28px; border: none; background: transparent; cursor: pointer; font-size: 16px; color: rgba(0,0,0,.45); border-radius: 4px; }
  .modal-close:hover { background: rgba(0,0,0,.06); }
  .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
  .modal-footer { padding: 12px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
  .toast {
    position: fixed; top: calc(var(--banner-h) + 16px); left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(0,0,0,.85); color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 2000;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .payload {
    background: #0f172a; color: #e2e8f0; border-radius: 8px; padding: 14px 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    line-height: 1.7; overflow-x: auto; white-space: pre;
  }
  .payload .omit { color: #fbbf24; }
  .mini-steps { display: flex; flex-direction: column; gap: 6px; font-size: 12px; margin: 8px 0 12px; }
  .mini-steps li { display: flex; gap: 8px; align-items: center; color: var(--text-secondary); list-style: none; }
  .mini-steps li.ok { color: #389e0d; }
  .mini-steps li.cur { color: var(--primary); font-weight: 600; }
  .mini-steps li.wait { color: rgba(0,0,0,.35); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .split { display: grid; grid-template-columns: 1.2fr .8fr; gap: 16px; }

  .role-switch { display:flex; align-items:center; gap:8px; }
  .role-switch select {
    height: 32px; border: 1px solid #d9d9d9; border-radius: 6px; padding: 0 8px;
    font-size: 13px; background:#fff; max-width: 280px;
  }
  body.portal-ext .sidebar { background:#10239e; }
  body.portal-ext .logo-mark { background:#fff; color:#10239e; }
  body.portal-biz .sidebar { background:#092b00; }
  body.portal-biz .logo-mark { background:#52c41a; }
  .perm-grid { width:100%; border-collapse:collapse; font-size:13px; }
  .perm-grid th, .perm-grid td { border:1px solid var(--border); padding:8px 10px; text-align:center; }
  .perm-grid th { background:#fafafa; font-weight:500; }
  .perm-grid td.l { text-align:left; }
  .perm-yes { color:#389e0d; }
  .perm-no { color:rgba(0,0,0,.35); }
  .id-card { border:1px solid var(--border); border-radius:8px; padding:14px 16px; background:#fff; }
  .subtabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:16px; }
  .subtab { padding:10px 16px; cursor:pointer; color:var(--text-secondary); border-bottom:2px solid transparent; margin-bottom:-1px; background:none; border-top:0; border-left:0; border-right:0; font-size:14px; }
  .subtab.on { color:var(--primary); border-bottom-color:var(--primary); font-weight:600; }
  .invite-panel { max-width:480px; margin:24px auto; background:#fff; border:1px solid var(--border); border-radius:8px; padding:32px; }
  .invite-panel h3 { font-size:18px; margin-bottom:8px; }
  .role-switch select { max-width: 340px; }
  @media (max-width: 1100px) {
    .stats, .channel-grid, .split, .kv-grid.col3, .form-grid { grid-template-columns: 1fr; }
  }
  body.auth-mode .sidebar, body.auth-mode .nav-toggle { display:none !important; }
  body.auth-mode .main { margin-left:0; }
  .auth-wrap { max-width:920px; margin:24px auto; display:grid; grid-template-columns:1fr 1fr; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 6px 24px rgba(0,0,0,.06); }
  .auth-brand { background:linear-gradient(160deg,#0b3d91,#1677ff); color:#fff; padding:36px 32px; }
  .auth-brand h2 { margin:16px 0 8px; font-size:22px; }
  .auth-brand p { opacity:.85; font-size:13px; line-height:1.7; }
  .auth-brand ul { margin:18px 0 0; padding-left:18px; font-size:13px; line-height:2; opacity:.92; }
  .auth-logo { width:44px; height:44px; border-radius:10px; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; font-weight:600; }
  .auth-card { padding:28px 32px; }
  .auth-tabs { display:flex; border-bottom:1px solid #f0f0f0; margin-bottom:16px; }
  .auth-tab { flex:1; text-align:center; padding:10px 0; cursor:pointer; color:#595959; border-bottom:2px solid transparent; }
  .auth-tab.on { color:#1677ff; border-bottom-color:#1677ff; font-weight:600; }
  .auth-ctx { background:#fffbe6; border:1px solid #ffe58f; color:#874d00; border-radius:6px; padding:8px 12px; font-size:12px; margin-bottom:12px; line-height:1.6; }
  .auth-locked { display:flex; align-items:center; justify-content:space-between; background:#fafafa; color:#262626; }
  .auth-locked span { font-size:11px; color:#8c8c8c; }
  .auth-agree { display:flex; gap:6px; align-items:flex-start; font-size:12px; color:#595959; margin:4px 0 14px; line-height:1.5; }
  .auth-submit { width:100%; justify-content:center; }
  .auth-foot { margin-top:12px; font-size:12px; color:#8c8c8c; text-align:center; }
  .auth-foot a { color:#1677ff; cursor:pointer; }
  .auth-demo { margin-top:12px; font-size:12px; color:#8c8c8c; background:#fafafa; border-radius:6px; padding:8px 12px; }
  .auth-demo summary { cursor:pointer; color:#595959; } .auth-demo div { margin-top:4px; }
  .pv-steps { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .pv-step { flex:1; min-width:84px; display:flex; align-items:center; gap:6px; font-size:12px; color:#8c8c8c; padding:8px; border-radius:6px; background:#f5f5f5; }
  .pv-step b { width:20px; height:20px; border-radius:50%; background:#d9d9d9; color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; }
  .pv-step.on { color:#1677ff; background:#e6f4ff; } .pv-step.on b { background:#1677ff; }
  .pv-step.done { color:#389e0d; background:#f6ffed; } .pv-step.done b { background:#52c41a; }
  .nav-toggle { display:none; border:1px solid #d9d9d9; background:#fff; border-radius:6px; width:34px; height:32px; font-size:16px; cursor:pointer; flex-shrink:0; }
  .nav-mask { display:none; }
  @media (max-width: 768px) {
    .demo-banner { font-size:11px; padding:0 8px; justify-content:flex-start; overflow:hidden; }
    #bannerText { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
    .sidebar { transform:translateX(-100%); transition:transform .2s; z-index:1200; width:240px; }
    body.nav-open .sidebar { transform:translateX(0); }
    body.nav-open .nav-mask { display:block; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1150; }
    .main { margin-left:0; }
    .nav-toggle { display:inline-flex; align-items:center; justify-content:center; }
    .header { height:auto; min-height:var(--header-h); flex-wrap:wrap; gap:8px; padding:8px 12px; }

function ensureWizardScope(){

function renderChannelTask(t, cid){
  const pack = rulePacks[cid];
  const c = t.channels[cid];
  const cls = c.status==="待补件"?"blocked":(c.status==="待交接"||c.status==="已交接")?"done":"";
  const mats = pack.materials.map(m=>{
    if(!m.required && m.key==="icp") return null;
    const d = docFor(m.key,t);
    const missed = (c.missing||[]).includes(m.key);
    if(missed || !d) return `<div class="material-row missing"><div class="name">${esc(m.name)} <span class="tag tag-red">缺失</span></div><div class="meta">${esc(m.rule|| (m.format+"，"+m.max))} · ${m.level}级</div></div>`;
    const cls2 = d.status==="即将到期"?"expire":"reused";
    return `<div class="material-row ${cls2}"><div class="name">${esc(m.name)} <span class="tag tag-green">可复用</span></div><div class="meta">${d.ver} · ${d.status}</div></div>`;
  }).filter(Boolean).join("");
  const stepHtml = pack.steps.map(s=>{
    const done = c.progress.includes(s);
    const cur = !done && pack.steps.find(x=>!c.progress.includes(x))===s;
    return `<li class="${done?"ok":cur?"cur":"wait"}"><span class="dot"></span>${s}${done?" · 完成":cur?" · 当前":""}</li>`;
  }).join("");
  return `<div class="channel-card ${cls}">
    <div class="hd"><strong>${pack.name}</strong>${statusTag(c.status)}</div>
    <div class="bd">
      <p class="form-hint" style="margin-bottom:8px">${esc(pack.note)}</p>
      <ul class="mini-steps">${stepHtml}</ul>
      ${mats}
      ${c.mid?`<div class="kv-grid" style="margin-top:12px">
        ${c.mid?`<div class="kv"><div class="k">渠道商户号</div><div class="v">${c.mid}</div></div>`:""}
        ${c.term?`<div class="kv"><div class="k">终端号</div><div class="v">${c.term}</div></div>`:""}
        ${c.code?`<div class="kv"><div class="k">进件编码</div><div class="v">${c.code}</div></div>`:""}
      </div>`:""}
      <p class="form-hint" style="margin-top:10px">${esc(c.note)}</p>
      ${c.status==="待补件"&&cid==="ums"?`<div style="margin-top:10px"><button class="btn btn-primary btn-sm" onclick="demoUploadFront()">补传门头合影</button> <button class="btn btn-sm" onclick="go('rules','ums')">查看银联规则包</button></div>`:""}
      ${cid==="cmb"&&c.status==="渠道入网中"?`<div style="margin-top:10px"><button class="btn btn-sm" onclick="demoCmbBack()">模拟甲方回写商编</button></div>`:""}
    </div>
  </div>`;
}

function extTicket(){
  const list = myTickets();
  const id = extViewTicket || (roleMeta().ticket);
  return list.find(x=>x.id===id) || list[0] || null;
}
function openApplicantReadOnly(){
  currentRole = "applicant";
  extViewTicket = "WN20261028015";
  go("extProject");
  toast("已以同一人打开已交接项目，申请门户为只读");
}
function extReadonly(t){
  if(!t) return true;
  return t.overall==="已交接" || (invitations.find(i=>i.ticket===t.id && i.person==="周宁")||{}).access==="只读";
}

function pageExtDocs(){
  const t = extTicket();
  crumb(["资料补传"]);
  if(!t) return `<div class="hint">还没有申请单，请先发起申请。</div><button class="btn btn-primary" onclick="go('ticketNew')">发起入网申请</button>`;
  const ro = extReadonly(t);
  const blocks = Object.keys(t.channels).map(cid=>{
    const pack=rulePacks[cid], c=t.channels[cid];
    const rows=pack.materials.filter(m=>m.required).map(m=>{
      const d=docFor(m.key,t);
      const missed=(c.missing||[]).includes(m.key) || !d;
      if(missed) return `<div class="material-row missing"><div class="name">${esc(m.name)} <span class="tag tag-red">待补</span></div>
        <div class="meta">${esc(m.rule|| (m.format+"，"+m.max))} · ${m.level}级</div>
        ${!ro && m.key==="storefront"?`<button class="btn btn-primary btn-sm" onclick="demoUploadFront()">补传</button>`:`${!ro?`<span class="upload-fake">上传（演示）</span>`:""}`}</div>`;
      const cls2=d.status==="即将到期"?"expire":"reused";
      return `<div class="material-row ${cls2}"><div class="name">${esc(m.name)} <span class="tag tag-green">已引用</span></div><div class="meta">${d.ver} · ${d.status} · 来自资料库，无需重传</div></div>`;
    }).join("");
    return `<div class="channel-card ${c.status==="待补件"?"blocked":""}"><div class="hd"><strong>${pack.name}材料</strong>${statusTag(c.status)}</div><div class="bd">${rows}</div></div>`;
  }).join("");
  return `
    <div class="hint">${ro?"申请已交接，材料只读，不能再改。":"绿色为资料库可复用件，红色为该渠道仍缺的材料。你看不到其他项目，也不能查看内部审核意见。"}</div>
    <div class="channel-grid">${blocks}</div>`;
}
function pageExtProgress(){
  const t = extTicket();
  crumb(["申请进度"]);
  if(!t) return `<div class="hint">还没有申请单，请先发起申请。</div><button class="btn btn-primary" onclick="go('ticketNew')">发起入网申请</button>`;
  return `
    <div class="hint">进度对外部只展示状态和缺件，不展示审核过程意见、密钥或交接载荷细节。</div>
    <div class="card"><div class="card-body">
      <div class="kv-grid">
        <div class="kv"><div class="k">工单</div><div class="v">${t.id}　${statusTag(t.overall)}</div></div>
        <div class="kv"><div class="k">最近更新</div><div class="v">${t.updated}</div></div>
      </div>
      <div class="channel-grid" style="margin-top:16px">
        ${Object.keys(t.channels).map(cid=>{
          const pack=rulePacks[cid], c=t.channels[cid];
          const steps=pack.steps.map(s=>{
            const done=c.progress.includes(s);
            const cur=!done && pack.steps.find(x=>!c.progress.includes(x))===s;
            const hide = ["内部审核"].includes(s) && !done;
            const label = s==="内部审核" ? (done?"内部审核已完成":"内部处理中") : s;
            return `<li class="${done?"ok":cur?"cur":"wait"}"><span class="dot"></span>${label}${done?" · 完成":cur?" · 当前":""}</li>`;
          }).join("");
          return `<div class="channel-card"><div class="hd"><strong>${pack.name}</strong>${statusTag(c.status)}</div>
            <div class="bd"><ul class="mini-steps">${steps}</ul><p class="form-hint">${esc(c.note)}</p>
            ${c.mid?`<div class="form-hint" style="margin-top:8px">渠道回写将在交接后进入业务平台，此处不展示密钥。</div>`:""}
          </div></div>`;
        }).join("")}
      </div>
    </div></div>`;
}
function pageBizHome(){
  crumb(["已接收商户"]);
  const t = tickets.find(x=>x.id==="WN20261028015");
  return `
    <div class="hint">这是原商户业务平台的示意页，不是入网系统。周宁与申请人是同一人，但这里只有交接后的运行态结果，没有审核台、补件和保管箱。</div>
    <div class="card"><div class="card-hd"><h3>已接收 · ${esc(store(t.storeId).name)}</h3>${statusTag("已接收")}</div>
      <div class="card-body">
        <div class="kv-grid col3">
          <div class="kv"><div class="k">来源交接单</div><div class="v">HO20261106001</div></div>
          <div class="kv"><div class="k">企业主体</div><div class="v">${esc(ent(t.entId).name)}</div></div>
          <div class="kv"><div class="k">经办人</div><div class="v">周宁 · 138****0012（身份映射）</div></div>
          ${Object.keys(t.channels).map(cid=>`<div class="kv"><div class="k">${rulePacks[cid].name}商户号</div><div class="v">${t.channels[cid].mid||"—"}</div></div>`).join("")}
        </div>
        <p class="form-hint" style="margin:16px 0">交易、对账、收款码、商户启停等运营功能仍在本业务平台，本示意不展开。密钥明文不随交接下发。</p>
        <div style="display:flex;gap:8px">
          <button class="btn" onclick="openApplicantReadOnly()">查看同一人在申请门户的只读状态</button>
          <button class="btn" onclick="switchRole('ops','users')">返回内部权限设计</button>
        </div>
      </div>
    </div>`;
}

function render(){
  document.body.classList.remove("nav-open");
  if(!isAllowed(route.page)) { route = { page: defaultPage(), id: null }; }
  renderChrome();
  renderMenu();
  const p = route.page, id=route.id;
  let html="";
  if(p==="workbench") html=pageWorkbench();
  else if(p==="tickets") html=pageTickets();
  else if(p==="ticket") html=pageTicket(id);
  else if(p==="ticketNew") html=pageTicketNew();
  else if(p==="review") html=pageReview();
  else if(p==="board") html=pageBoard();
  else if(p==="enterprises") html=pageEntities("enterprises");
  else if(p==="stores") html=pageEntities("stores");
  else if(p==="accounts") html=pageEntities("accounts");
  else if(p==="docs") html=pageDocs();
  else if(p==="tasks") html=pageTasks();
  else if(p==="auth") html=pageAuth();
  else if(p==="vault") html=pageVault();
  else if(p==="handoff") html=pageHandoff();
  else if(p==="handoffDetail") html=pageHandoffDetail(id);
  else if(p==="sync") html=pageSync();
  else if(p==="rules") html=pageRules(id);
  else if(p==="users") html=pageUsers();
  else if(p==="inviteActivate") html=pageInviteActivate();
  else if(p==="register") html=pageRegister();
  else if(p==="login") html=pageLogin("login");
  else if(p==="signup") html=pageLogin("signup");
  else if(p==="audit") html=pageAudit();
  else if(p==="extProject") html=pageExtProject();
  else if(p==="extDocs") html=pageExtDocs();
  else if(p==="extProgress") html=pageExtProgress();
  else if(p==="bizHome") html=pageBizHome();
  else html=pageWorkbench();
  $("app").innerHTML = html;
}
if(location.hash){
  const p=location.hash.replace(/^#\//,"").split("/");
  route={page:p[0]||"workbench", id:p[1]||null};
}
render();
</script>
