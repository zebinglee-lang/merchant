<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>商户入网申请平台 · 原型</title>
<style>
  :root {
    --primary: #1677ff;
    --primary-hover: #4096ff;
    --primary-active: #0958d9;
    --sidebar-bg: #001529;
    --sidebar-width: 220px;
    --header-h: 56px;
    --banner-h: 32px;
    --border: #f0f0f0;
    --text: rgba(0,0,0,.88);
    --text-secondary: rgba(0,0,0,.45);
    --success: #52c41a;
    --warning: #faad14;
    --error: #ff4d4f;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px; color: var(--text); background: #f5f5f5; min-height: 100vh;
  }
  a { color: var(--primary); text-decoration: none; cursor: pointer; }
  a:hover { color: var(--primary-hover); }
  .demo-banner {
    position: fixed; top: 0; left: 0; right: 0; height: var(--banner-h);
    background: linear-gradient(90deg, #fff7e6, #fff1b8);
    border-bottom: 1px solid #ffe58f; color: #ad6800; font-size: 12px;
    display: flex; align-items: center; justify-content: center; gap: 8px; z-index: 1000;
  }
  .demo-banner .tag { background: #faad14; color: #fff; padding: 1px 6px; border-radius: 3px; font-weight: 600; }
  .layout { display: flex; padding-top: var(--banner-h); min-height: 100vh; }
  .sidebar {
    width: var(--sidebar-width); background: var(--sidebar-bg); color: rgba(255,255,255,.65);
    position: fixed; top: var(--banner-h); left: 0; bottom: 0;
    display: flex; flex-direction: column; z-index: 100;
  }
  .logo {
    height: var(--header-h); display: flex; align-items: center; gap: 10px;
    padding: 0 16px; color: #fff; font-size: 15px; font-weight: 600;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .logo-mark {
    width: 28px; height: 28px; border-radius: 6px; background: var(--primary);
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0;
  }
  .logo-sub { font-size: 11px; color: rgba(255,255,255,.45); font-weight: 400; margin-top: 1px; }
  .menu { padding: 8px 0 24px; flex: 1; overflow-y: auto; }
  .menu-group-title { padding: 10px 20px 4px; font-size: 12px; color: rgba(255,255,255,.35); }
  .menu-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 20px;
    cursor: pointer; transition: all .15s; border-right: 3px solid transparent;
  }
  .menu-item:hover { color: #fff; background: rgba(255,255,255,.06); }
  .menu-item.active { color: #fff; background: var(--primary); }
  .menu-item .icon { width: 16px; text-align: center; opacity: .85; font-size: 13px; }
  .main { margin-left: var(--sidebar-width); flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .header {
    height: var(--header-h); background: #fff; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    position: sticky; top: var(--banner-h); z-index: 50;
  }
  .breadcrumb { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); }
  .breadcrumb .curr { color: var(--text); }
  .header-right { display: flex; align-items: center; gap: 16px; color: var(--text-secondary); font-size: 13px; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 12px;
  }
  .content { padding: 16px 24px 40px; }
  .card { background: #fff; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 16px; }
  .card-body { padding: 16px 24px; }
  .card-hd { padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .card-hd h3 { font-size: 15px; font-weight: 600; }
  .filter-row { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; }
  .filter-item { display: flex; flex-direction: column; gap: 4px; }
  .filter-item label { font-size: 12px; color: var(--text-secondary); }
  .filter-actions { margin-left: auto; display: flex; gap: 8px; align-items: flex-end; }
  .input, .select {
    height: 32px; padding: 4px 11px; border: 1px solid #d9d9d9; border-radius: 6px;
    font-size: 14px; outline: none; background: #fff; min-width: 160px;
    transition: border-color .2s, box-shadow .2s;
  }
  .input:focus, .select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,.15); }
  .input.block, .select.block { width: 100%; min-width: 0; }
  .textarea {
    width: 100%; min-height: 72px; padding: 8px 11px; border: 1px solid #d9d9d9; border-radius: 6px;
    font-size: 14px; font-family: inherit; resize: vertical; outline: none;
  }
  .textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,.15); }
  .btn {
    height: 32px; padding: 0 15px; border-radius: 6px; border: 1px solid #d9d9d9;
    background: #fff; color: var(--text); font-size: 14px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: all .2s; white-space: nowrap;
  }
  .btn:hover { color: var(--primary); border-color: var(--primary); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
  .btn-link { border: none; background: transparent; color: var(--primary); padding: 0 4px; height: auto; }
  .btn-link:hover { color: var(--primary-hover); }
  .btn-lg { height: 36px; padding: 0 20px; }
  .btn-sm { height: 26px; padding: 0 10px; font-size: 12px; }
  .table-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 12px; }
  .table-wrap { overflow-x: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.data th {
    background: #fafafa; text-align: left; font-weight: 500; padding: 12px 16px;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.data td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.data tr:hover td { background: #fafafa; }
  table.data tr.clickable { cursor: pointer; }
  .tag {
    display: inline-flex; align-items: center; padding: 0 7px; height: 22px; border-radius: 4px;
    font-size: 12px; border: 1px solid transparent; white-space: nowrap;
  }
  .tag-blue { background: #e6f4ff; color: #1677ff; border-color: #91caff; }
  .tag-green { background: #f6ffed; color: #389e0d; border-color: #b7eb8f; }
  .tag-orange { background: #fff7e6; color: #d46b08; border-color: #ffd591; }
  .tag-red { background: #fff2f0; color: #cf1322; border-color: #ffccc7; }
  .tag-default { background: #fafafa; color: rgba(0,0,0,.65); border-color: #d9d9d9; }
  .tag-purple { background: #f9f0ff; color: #531dab; border-color: #d3adf7; }
  .tag-cyan { background: #e6fffb; color: #08979c; border-color: #87e8de; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
  .stat {
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; cursor: pointer; transition: box-shadow .2s;
  }
  .stat:hover { box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .stat .n { font-size: 28px; font-weight: 600; line-height: 1.2; }
  .stat .l { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
  .stat.warn .n { color: #d46b08; }
  .stat.danger .n { color: #cf1322; }
  .stat.info .n { color: var(--primary); }
  .stat.ok .n { color: #389e0d; }
  .hint {
    background: #e6f4ff; border: 1px solid #91caff; color: #0958d9;
    border-radius: 6px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; line-height: 1.6;
  }
  .hint.warn { background: #fffbe6; border-color: #ffe58f; color: #ad6800; }
  .kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; }
  .kv-grid.col3 { grid-template-columns: 1fr 1fr 1fr; }
  .kv { display: flex; flex-direction: column; gap: 4px; }
  .kv .k { font-size: 12px; color: var(--text-secondary); }
  .kv .v { font-size: 14px; }
  .material-list { display: flex; flex-direction: column; gap: 10px; }
  .material-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    border: 1px solid var(--border); border-radius: 6px; background: #fafafa;
  }
  .material-row.reused { background: #f6ffed; border-color: #b7eb8f; }
  .material-row.missing { background: #fff2f0; border-color: #ffccc7; }
  .material-row.expire { background: #fffbe6; border-color: #ffe58f; }
  .material-row .name { flex: 1; font-weight: 500; }
  .material-row .meta { font-size: 12px; color: var(--text-secondary); }
  .channel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .channel-card { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff; }
  .channel-card .hd {
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
    background: #fafafa; border-bottom: 1px solid var(--border);
  }
  .channel-card .bd { padding: 14px 16px; }
  .channel-card.blocked { border-color: #ffccc7; }
  .channel-card.blocked .hd { background: #fff2f0; }
  .channel-card.done { border-color: #b7eb8f; }
  .channel-card.done .hd { background: #f6ffed; }
  .timeline { display: flex; gap: 0; margin: 8px 0 20px; overflow-x: auto; padding-bottom: 4px; }
  .tl-step { flex: 1; min-width: 86px; text-align: center; position: relative; }
  .tl-step::before {
    content: ""; position: absolute; top: 10px; left: 0; right: 0; height: 2px; background: #e8e8e8; z-index: 0;
  }
  .tl-step:first-child::before { left: 50%; }
  .tl-step:last-child::before { right: 50%; }
  .tl-dot {
    width: 20px; height: 20px; border-radius: 50%; margin: 0 auto 8px; position: relative; z-index: 1;
    background: #fff; border: 2px solid #d9d9d9;
  }
  .tl-step.done .tl-dot { background: var(--primary); border-color: var(--primary); }
  .tl-step.current .tl-dot { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(22,119,255,.15); }
  .tl-step.done::before, .tl-step.current::before { background: #91caff; }
  .tl-label { font-size: 12px; color: var(--text-secondary); }
  .tl-step.current .tl-label { color: var(--primary); font-weight: 600; }
  .tl-step.done .tl-label { color: var(--text); }
  .kanban { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start; }
  .col { background: #fafafa; border: 1px solid var(--border); border-radius: 8px; min-width: 200px; flex: 1; }
  .col-hd { padding: 10px 12px; font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; }
  .col-bd { padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 80px; }
  .kcard {
    background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px;
    cursor: pointer; font-size: 13px;
  }
  .kcard:hover { border-color: var(--primary); }
  .kcard .t { font-weight: 600; margin-bottom: 6px; }
  .kcard .s { color: var(--text-secondary); font-size: 12px; margin-bottom: 6px; }
  .steps { display: flex; justify-content: space-between; margin-bottom: 24px; position: relative; padding: 0 8px; }
  .steps::before { content: ""; position: absolute; top: 14px; left: 40px; right: 40px; height: 1px; background: #e8e8e8; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; z-index: 1; flex: 1; cursor: pointer; }
  .step-dot {
    width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 1px solid #d9d9d9;
    display: flex; align-items: center; justify-content: center; font-size: 13px; color: rgba(0,0,0,.45); font-weight: 500;
  }
  .step.active .step-dot { background: var(--primary); border-color: var(--primary); color: #fff; }
  .step.done .step-dot { background: #fff; border-color: var(--primary); color: var(--primary); }
  .step-label { font-size: 12px; color: rgba(0,0,0,.45); }
  .step.active .step-label { color: var(--primary); font-weight: 500; }
  .step-label { text-align: center; line-height: 1.3; max-width: 7em; }
  .wiz-sec { font-size: 14px; font-weight: 600; margin: 20px 0 10px; }
  .pay-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .readonly-box { background: #fafafa; border: 1px solid #f0f0f0; border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; margin-bottom: 8px; }
  .form-item { display: flex; flex-direction: column; gap: 6px; }
  .form-item.full { grid-column: 1 / -1; }
  .form-label { font-size: 14px; display: flex; align-items: center; gap: 2px; }
  .form-label .req { color: var(--error); margin-right: 2px; }
  .form-hint { font-size: 12px; color: var(--text-secondary); }
  .checkbox, .radio { display: inline-flex; align-items: flex-start; gap: 8px; cursor: pointer; }
  .checkbox input, .radio input { accent-color: var(--primary); margin-top: 3px; }
  .chan-pick {
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .chan-opt {
    flex: 1; min-width: 240px; border: 1px solid #d9d9d9; border-radius: 8px; padding: 14px 16px;
    cursor: pointer; background: #fff;
  }
  .chan-opt:hover { border-color: var(--primary); }
  .chan-opt.on { border-color: var(--primary); background: #e6f4ff; }
  .chan-opt .ttl { font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .chan-opt .desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1100;
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff; border-radius: 8px; width: 860px; max-width: 100%;
    max-height: calc(100vh - 48px); display: flex; flex-direction: column;
    box-shadow: 0 6px 16px rgba(0,0,0,.08), 0 9px 28px 8px rgba(0,0,0,.05);
  }
  .modal-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-close { width: 28px; height: 28px; border: none; background: transparent; cursor: pointer; font-size: 16px; color: rgba(0,0,0,.45); border-radius: 4px; }
  .modal-close:hover { background: rgba(0,0,0,.06); }
  .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
  .modal-footer { padding: 12px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
  .toast {
    position: fixed; top: calc(var(--banner-h) + 16px); left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(0,0,0,.85); color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 2000;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .payload {
    background: #0f172a; color: #e2e8f0; border-radius: 8px; padding: 14px 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    line-height: 1.7; overflow-x: auto; white-space: pre;
  }
  .payload .omit { color: #fbbf24; }
  .mini-steps { display: flex; flex-direction: column; gap: 6px; font-size: 12px; margin: 8px 0 12px; }
  .mini-steps li { display: flex; gap: 8px; align-items: center; color: var(--text-secondary); list-style: none; }
  .mini-steps li.ok { color: #389e0d; }
  .mini-steps li.cur { color: var(--primary); font-weight: 600; }
  .mini-steps li.wait { color: rgba(0,0,0,.35); }
  .mini-steps li.skip { color: #d46b08; }
  .mini-steps li.skip .tag { margin-left: 4px; }
  .tl-step { min-width: 78px; }
  .ho-kind { font-size: 12px; color: var(--text-secondary); margin-left: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .split { display: grid; grid-template-columns: 1.2fr .8fr; gap: 16px; }

  .role-switch { display:flex; align-items:center; gap:8px; }
  .role-switch select {
    height: 32px; border: 1px solid #d9d9d9; border-radius: 6px; padding: 0 8px;
    font-size: 13px; background:#fff; max-width: 280px;
  }
  body.portal-ext .sidebar { background:#10239e; }
  body.portal-ext .logo-mark { background:#fff; color:#10239e; }
  body.portal-biz .sidebar { background:#092b00; }
  body.portal-biz .logo-mark { background:#52c41a; }
  .perm-grid { width:100%; border-collapse:collapse; font-size:13px; }
  .perm-grid th, .perm-grid td { border:1px solid var(--border); padding:8px 10px; text-align:center; }
  .perm-grid th { background:#fafafa; font-weight:500; }
  .perm-grid td.l { text-align:left; }
  .perm-yes { color:#389e0d; }
  .perm-no { color:rgba(0,0,0,.35); }
  .id-card { border:1px solid var(--border); border-radius:8px; padding:14px 16px; background:#fff; }
  .subtabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:16px; }
  .subtab { padding:10px 16px; cursor:pointer; color:var(--text-secondary); border-bottom:2px solid transparent; margin-bottom:-1px; background:none; border-top:0; border-left:0; border-right:0; font-size:14px; }
  .subtab.on { color:var(--primary); border-bottom-color:var(--primary); font-weight:600; }
  .invite-panel { max-width:480px; margin:24px auto; background:#fff; border:1px solid var(--border); border-radius:8px; padding:32px; }
  .invite-panel h3 { font-size:18px; margin-bottom:8px; }
  .role-switch select { max-width: 340px; }
  @media (max-width: 1100px) {
    .stats, .channel-grid, .split, .kv-grid.col3, .form-grid { grid-template-columns: 1fr; }
  }
  body.auth-mode .sidebar, body.auth-mode .nav-toggle { display:none !important; }
  body.auth-mode .main { margin-left:0; }
  .auth-wrap { max-width:920px; margin:24px auto; display:grid; grid-template-columns:1fr 1fr; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 6px 24px rgba(0,0,0,.06); }
  .auth-brand { background:linear-gradient(160deg,#0b3d91,#1677ff); color:#fff; padding:36px 32px; }
  .auth-brand h2 { margin:16px 0 8px; font-size:22px; }
  .auth-brand p { opacity:.85; font-size:13px; line-height:1.7; }
  .auth-brand ul { margin:18px 0 0; padding-left:18px; font-size:13px; line-height:2; opacity:.92; }
  .auth-logo { width:44px; height:44px; border-radius:10px; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; font-weight:600; }
  .auth-card { padding:28px 32px; }
  .auth-tabs { display:flex; border-bottom:1px solid #f0f0f0; margin-bottom:16px; }
  .auth-tab { flex:1; text-align:center; padding:10px 0; cursor:pointer; color:#595959; border-bottom:2px solid transparent; }
  .auth-tab.on { color:#1677ff; border-bottom-color:#1677ff; font-weight:600; }
  .auth-ctx { background:#fffbe6; border:1px solid #ffe58f; color:#874d00; border-radius:6px; padding:8px 12px; font-size:12px; margin-bottom:12px; line-height:1.6; }
  .auth-locked { display:flex; align-items:center; justify-content:space-between; background:#fafafa; color:#262626; }
  .auth-locked span { font-size:11px; color:#8c8c8c; }
  .auth-agree { display:flex; gap:6px; align-items:flex-start; font-size:12px; color:#595959; margin:4px 0 14px; line-height:1.5; }
  .auth-submit { width:100%; justify-content:center; }
  .auth-foot { margin-top:12px; font-size:12px; color:#8c8c8c; text-align:center; }
  .auth-foot a { color:#1677ff; cursor:pointer; }
  .auth-demo { margin-top:12px; font-size:12px; color:#8c8c8c; background:#fafafa; border-radius:6px; padding:8px 12px; }
  .auth-demo summary { cursor:pointer; color:#595959; } .auth-demo div { margin-top:4px; }
  .pv-steps { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .pv-step { flex:1; min-width:84px; display:flex; align-items:center; gap:6px; font-size:12px; color:#8c8c8c; padding:8px; border-radius:6px; background:#f5f5f5; }
  .pv-step b { width:20px; height:20px; border-radius:50%; background:#d9d9d9; color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; }
  .pv-step.on { color:#1677ff; background:#e6f4ff; } .pv-step.on b { background:#1677ff; }
  .pv-step.done { color:#389e0d; background:#f6ffed; } .pv-step.done b { background:#52c41a; }
  .nav-toggle { display:none; border:1px solid #d9d9d9; background:#fff; border-radius:6px; width:34px; height:32px; font-size:16px; cursor:pointer; flex-shrink:0; }

function go(page, id){
  if(page==="ticketNew" && route.page!=="ticketNew") wizard.step = 1;
  route = { page, id: id||null };
  location.hash = id ? `#/${page}/${id}` : `#/${page}`;
  render();
}
window.addEventListener("hashchange", () => {
  const p = location.hash.replace(/^#\//,"").split("/");
  route = { page: p[0]||"workbench", id: p[1]||null };
  render();
});

function defaultPage(){
  if(needsPhone()) return (currentRole==="registrant" && !myReg.phoneRaw) ? "signup" : "login";

  if(currentRole==="registrant" && myReg.status!=="已通过") return "register";
  if(currentRole==="applicant" || currentRole==="field" || currentRole==="invitee" || currentRole==="registrant") return "extProject";
  if(currentRole==="biz") return "bizHome";
  return "workbench";
}

function computeOverall(t){
  if(t.voided) return "已作废";
  if(t.withdrawn) return "已撤回";
  const sts = Object.values(t.channels).map(c=>c.status);
  const live = sts.filter(s=>s!=="渠道终止");
  if(!live.length) return "已终止";
  if(live.every(s=>s==="已交接")) return "已交接";
  if(live.some(s=>s==="已交接")) return "部分交接";
  if(live.every(s=>s===live[0])) return live[0];
  return "进行中";
}
function chanSummary(t){ return Object.keys(t.channels).map(cid=>`${rulePacks[cid].short} ${statusTag(t.channels[cid].status)}`).join(" "); }
function isOpen(t){ return !["已交接","已作废","已终止"].includes(computeOverall(t)); }
function isOwner(t){ const m = roleMetaRaw(); return !!m && m.portal==="external" && t.applicant===m.name; }
function rollupIndex(t){
  const ov = computeOverall(t);
  const order = STATUS.slice();
  if(ov==="已撤回") return 0;
  if(ov==="已作废" || ov==="已终止") return -1;
  if(ov==="部分交接") return order.indexOf("待上线交接");
  if(ov==="进行中"){
    const live = Object.values(t.channels).filter(c=>c.status!=="渠道终止").map(c=>order.indexOf(c.status)).filter(i=>i>=0);
    return live.length ? Math.min(...live) : 3;
  }
  const i = order.indexOf(ov); return i<0?0:i;
}
function canWithdraw(t){
  if(t.voided || t.withdrawn) return false;
  const chs = Object.values(t.channels);
  return chs.some(c=>c.status!=="渠道终止") && chs.every(c=>c.status==="渠道终止" || (["待补件","待审核"].includes(c.status) && !c.progress.includes("内部审核")));
}

function demoUpload(id, key){
  const t = tickets.find(x=>x.id===id); if(!t) return null;
  let mdef = null;
  Object.keys(t.channels).forEach(cid=>{ const m = rulePacks[cid].materials.find(x=>x.key===key); if(m) mdef = m; });
  if(!mdef) return null;
  const owner = mdef.level==="企业" ? t.entId : mdef.level==="门店" ? t.storeId : t.acctId;
  const ownerName = mdef.level==="企业" ? ent(t.entId).short : mdef.level==="门店" ? store(t.storeId).name : "账户 "+acct(t.acctId).acct;
  const d = docs.find(x=>x.key===key && x.owner===owner);
  if(d){ d.ver = "V"+(parseInt(d.ver.slice(1),10)+1); d.status = "有效"; }
  else docs.push({ id:"DU"+String(docs.length+1).padStart(2,"0"), key, name:mdef.name, owner, ownerName, level:mdef.level, ver:"V1", expire:"2027-11-15", status:"有效", reused:1 });
  const back = [];
  Object.keys(t.channels).forEach(cid=>{
    const c = t.channels[cid];
    if(!(c.missing||[]).includes(key)) return;
    c.missing = c.missing.filter(k=>k!==key);
    (c.rejects||[]).forEach(r=>{ if(r.key===key) r.resolved = true; });
    if(c.status==="待补件" && !c.missing.length){
      c.status = "待审核"; if(!c.progress.includes("材料预检")) c.progress.unshift("材料预检");
      c.note = "补件已齐，待内部审核"; back.push(rulePacks[cid].short);
    }
  });
  if(back.length) t.submittedAt = nowStr();
  logT(t, "补传材料", "补传「"+mdef.name+"」"+(back.length?"，"+back.join("、")+" 回到待审核":""));
  if(back.length) notify(t.reviewer || "reviewer", t.id+" 补件已齐", back.join("、")+" 回到待审核"+(t.reviewer?"，仍由你处理":"，待认领")+"。", {page:"review"}, true);
  return { mdef, back };
}

/* ========== 按渠道交接 / 渠道终止 / 渠道推进 ========== */
const TERM_REASONS = ["渠道长期未回单，商户放弃该渠道","商户经营范围不符合该渠道要求","重复申请，保留另一张工单"];
function stepDone(c, st){ return (c.progress||[]).includes(st) || isSkipped(c, st); }
function isSkipped(c, st){ return !!(c.skipped||[]).find(x=>x.step===st); }
function skipInfo(c, st){ return (c.skipped||[]).find(x=>x.step===st); }
function nextStep(pack, c){ return (pack.steps||[]).find(st=>!stepDone(c, st)); }
function markStep(c, st){ if(st && !(c.progress||[]).includes(st)) c.progress.push(st); }
function skipPolicy(cid, step){
  if(NEVER_SKIP.includes(step)) return "never";
  if(step==="协议签署") return "optional";
  if(step==="渠道送审") return cid==="cmb" ? "optional" : "force";
  if(step==="认证授权") return "reason";
  return "force";
}
function skipPolicyLabel(pol){
  return { never:"不可跳过（配置交接、上线交接不能跳过）", optional:"默认可跳过，须选节点并填写原因", reason:"可跳过，必须填写原因", force:"默认不可跳过；演示可强制跳过，但必须记原因" }[pol] || pol;
}
function hoKindName(kind){ return kind==="config" ? "配置交接" : "上线交接"; }
function hoFor(tid, cid, kind){
  if(kind) return handoffs.find(h=>h.ticket===tid && h.cid===cid && h.kind===kind);
  return handoffs.find(h=>h.ticket===tid && h.cid===cid && h.kind==="golive") || handoffs.find(h=>h.ticket===tid && h.cid===cid);
}
function hoKey(h){ return h.id; }
function inferHoKind(c){
  if(!c) return "golive";
  if(c.status==="待配置交接") return "config";
  if(c.status==="待上线交接") return "golive";
  return null;
}
function newHandoff(tid, cid, kind){
  return { id:"HO20261115"+String(handoffs.length+1).padStart(3,"0"), ticket:tid, cid, kind, at:"—", to:"原商户业务平台", status:"待发送" };
}
function genHandoff(tid, cid, kind){
  const t = tickets.find(x=>x.id===tid); if(!t) return;
  const c = t.channels[cid];
  kind = kind || inferHoKind(c);
  if(kind==="config" && c.status!=="待配置交接"){ toast("该渠道尚未到待配置交接"); return; }
  if(kind==="golive" && c.status!=="待上线交接"){ toast("该渠道尚未到待上线交接"); return; }
  if(!kind){ toast("当前状态不能发起交接"); return; }
  let h = hoFor(tid, cid, kind);
  if(!h){
    h = newHandoff(tid, cid, kind);
    handoffs.unshift(h);
    logT(t, hoKindName(kind), rulePacks[cid].short+" "+hoKindName(kind)+"单 "+h.id+" 已生成");
  }
  go("handoffDetail", h.id);
}
function confirmHandoff(tid, cid, kind){
  const t = tickets.find(x=>x.id===tid); const c = t && t.channels[cid];
  kind = kind || inferHoKind(c);
  if(!c || !kind){ toast("该渠道不在可确认交接的状态"); return; }
  if(kind==="config" && c.status!=="待配置交接"){ toast("该渠道不在待配置交接状态"); return; }
  if(kind==="golive" && c.status!=="待上线交接"){ toast("该渠道不在待上线交接状态"); return; }
  let h = hoFor(tid, cid, kind);
  if(!h){ h = newHandoff(tid, cid, kind); handoffs.unshift(h); }
  h.status = "已接收"; h.at = nowStr();
  if(kind==="config"){
    markStep(c, "配置交接");
    c.status = "配置已交接";
    c.note = "配置交接单已交给运行态，待商编配置和业务系统同步回告（运行态配置中）";
    logT(t, "配置交接", rulePacks[cid].short+" 配置交接单 "+h.id+" 已被运行态接收。申请平台不做商编配置或业务系统配置。");
    notify("ops", t.id+" "+rulePacks[cid].short+"配置已交接", "运行态进行商编配置和业务系统同步；完成后回告，再进入待认证授权。", {page:"ticket", id:t.id}, true);
    notify(t.applicant, t.id+" "+rulePacks[cid].short+"已配置交接", "渠道商编已交给业务平台做配置和系统同步，认证与测试尚未开始。", {page:"extProgress"});
  } else {
    markStep(c, "上线交接");
    c.status = "已交接";
    c.note = "已完成上线交接（"+h.id+"），可投入使用";
    logT(t, "上线交接", rulePacks[cid].short+" 上线交接单 "+h.id+" 已被业务平台接收（原型演示，未真实发送）");
    notify(t.applicant, t.id+" "+rulePacks[cid].short+"已完成上线交接", "该渠道已可投入使用。其他渠道按各自进度继续。", {page:"extProgress"});
  }
  toast(rulePacks[cid].short+" 已完成"+hoKindName(kind)+"；其他渠道不受影响"); render();
}

function doTerminate(tid, cid){
  const t = tickets.find(x=>x.id===tid); const c = t.channels[cid];
  const why = (($("tmWhy")||{}).value||"").trim();
  if(!why){ toast("请填写终止原因"); return; }
  if(["已交接","渠道终止"].includes(c.status)){ closeModal(); toast("该渠道不能终止"); return; }
  const at = logT(t, "渠道终止", rulePacks[cid].short+"："+why);

  const t = tickets.find(x=>x.id===tid); const c = t.channels[cid]; const pack = rulePacks[cid];
  const remain = pack.steps.filter(st=>!stepDone(c,st) && !["材料预检"].includes(st));
  if(!remain.length){ toast("没有可选择的待完成节点"); return; }
  const cur = nextStep(pack, c);
  showModal(`<div class="modal-header"><h3>跳过节点 · ${pack.name}</h3><button class="btn-link" onclick="closeModal()">关闭</button></div>

        <select class="select block" id="skStep">${remain.map(st=>`<option value="${st}" ${st===cur?"selected":""}>${st}（${skipPolicyLabel(skipPolicy(cid,st))}）</option>`).join("")}</select></div>
      <div class="form-item" style="margin-bottom:10px"><label class="form-label"><span class="req">*</span>跳过原因</label>

      <label class="checkbox"><input type="checkbox" id="skForce">该节点默认不可跳过时，勾选「强制跳过」（仍须填写原因；不能跳过配置交接和上线交接）</label>
    </div>

function doSkip(tid, cid){
  const t = tickets.find(x=>x.id===tid); const c = t.channels[cid]; const pack = rulePacks[cid];
  const step = (($("skStep")||{}).value||"").trim();
  const why = (($("skWhy")||{}).value||"").trim();
  const force = !!($("skForce")||{}).checked;
  if(!step){ toast("请选择要跳过的节点"); return; }
  if(!why){ toast("请填写跳过原因"); return; }
  const pol = skipPolicy(cid, step);
  if(pol==="never"){ toast("不能跳过配置交接和上线交接"); return; }
  if(pol==="force" && !force){ toast("该节点默认不可跳过，如需强制跳过请勾选并填写原因"); return; }
  if(step==="商编/终端回写" && !c.mid){ toast("请先录入商编回写，不能在无商编时跳过"); return; }
  if(stepDone(c, step)){ toast("该节点已完成或已跳过"); return; }
  c.skipped = c.skipped || [];
  c.skipped.push({ step, reason:why, by:meName(), at:nowStr(), force: pol==="force" || force });
  let extra = "";
  if(step==="认证授权" && c.status==="待认证授权"){
    c.status = "待测试"; c.authSkipped = true;
    extra = "，进入待测试";
    c.note = "已跳过认证授权（"+why+"），进入待测试";
  } else if(step==="联调测试" && c.status==="待测试"){
    c.status = "待上线交接"; c.testPassed = false; c.testSkipped = true;
    extra = "，进入待上线交接";
    c.note = "已强制跳过联调测试（"+why+"），进入待上线交接";
  } else if(step==="运行态配置回告" && ["配置已交接","运行态配置中"].includes(c.status)){
    c.status = "待认证授权";
    extra = "，进入待认证授权";
    c.note = "已强制跳过运行态配置回告（"+why+"），进入待认证授权";
    notifyAuthTodo(t, cid);
  } else if(step==="内部审核" && c.status==="待审核"){
    c.status = "渠道入网中";
    extra = "，进入渠道入网中";
    c.note = "已强制跳过内部审核（"+why+"）";
  } else {
    c.note = "已跳过「"+step+"」（"+why+"）"+(force||pol==="force"?"，强制":"");
  }
  logT(t, "跳过节点", pack.short+" 跳过「"+step+"」，原因："+why+(force||pol==="force"?"（强制）":"")+extra);
  closeModal(); toast(pack.short+" 已跳过「"+step+"」"); render();
}
function demoAdvance(tid, cid){
  const t = tickets.find(x=>x.id===tid); const c = t.channels[cid]; const pack = rulePacks[cid];
  if(!c || t.voided || t.withdrawn || ["已交接","渠道终止"].includes(c.status)) return;
  if(c.status==="待配置交接"){ genHandoff(tid, cid, "config"); return; }
  if(c.status==="配置已交接" || c.status==="运行态配置中"){ demoRuntimeDone(tid, cid); return; }
  if(c.status==="待上线交接"){ genHandoff(tid, cid, "golive"); return; }
  if(c.status==="待认证授权"){
    markStep(c, "认证授权"); c.authDone = true;
    c.status = "待测试"; c.note = "超管认证授权已确认，进入待测试";
    logT(t, "认证授权", pack.short+" 认证授权已确认，进入待测试");
    toast(pack.short+" 已推进到「待测试」"); render(); return;
  }
  if(c.status==="待测试"){
    markStep(c, "联调测试"); c.testPassed = true;
    c.status = "待上线交接"; c.note = "测试通过，可发起上线交接";
    logT(t, "测试通过", pack.short+" 联调测试通过，进入待上线交接");
    notify("ops", t.id+" "+pack.short+"待上线交接", "测试已通过，可按渠道发起上线交接。", {page:"handoff"}, true);
    toast(pack.short+" 测试通过，进入待上线交接"); render(); return;
  }
  if(c.status==="渠道入网中"){
    const nxt = nextStep(pack, c);
    if(!nxt || ["配置交接","运行态配置回告","认证授权","联调测试","上线交接"].includes(nxt)){
      if(c.mid){ c.status = "待配置交接"; c.note = "商编已回写，待发起配置交接"; logT(t, "渠道推进", pack.short+" → 待配置交接"); toast(pack.short+" 已进入待配置交接"); render(); }
      else toast("请先录入商编回写");
      return;
    }
    if(nxt==="商编/终端回写"){ openWriteback(tid, cid); return; }
    markStep(c, nxt);
    c.note = nxt==="渠道送审" ? ("已完成渠道送审："+(pack.sendLabel||"")) : ("已完成「"+nxt+"」（演示）");
    logT(t, "渠道推进", pack.short+" 完成「"+nxt+"」");
    toast(pack.short+" 已完成「"+nxt+"」"); render(); return;
  }
}

function dupCheck(storeId, chans){

function renderChannelTask(t, cid){
  const pack = rulePacks[cid];
  const c = t.channels[cid];
  const cls = c.status==="待补件"?"blocked":(["待上线交接","已交接","配置已交接"].includes(c.status)?"done":"");
  const mats = pack.materials.map(m=>{
    if(!m.required && m.key==="icp") return null;
    const d = docFor(m.key,t);
    const missed = (c.missing||[]).includes(m.key);
    if(!missed && !d && c.progress.includes("内部审核")) return `<div class="material-row"><div class="name">${esc(m.name)} <span class="tag tag-default">随本单提交</span></div><div class="meta">已通过审核，未沉淀到资料库</div></div>`;
    if(missed || !d) return `<div class="material-row missing"><div class="name">${esc(m.name)} <span class="tag tag-red">缺失</span></div><div class="meta">${esc(m.rule|| (m.format+"，"+m.max))} · ${m.level}级</div>${reasonHtml(c,m.key)}</div>`;
    const cls2 = d.status==="即将到期"?"expire":"reused";
    return `<div class="material-row ${cls2}"><div class="name">${esc(m.name)} <span class="tag tag-green">可复用</span></div><div class="meta">${d.ver} · ${d.status}</div></div>`;
  }).filter(Boolean).join("");
  const cur = nextStep(pack, c);
  const stepHtml = pack.steps.map(st=>{
    const sk = skipInfo(c, st);
    const done = (c.progress||[]).includes(st);
    const isCur = !done && !sk && st===cur;
    const hint = st==="渠道送审" ? `<span class="form-hint">（${esc(pack.sendLabel||"")}）</span>` : "";
    if(sk) return `<li class="skip"><span class="dot"></span>${st}${hint} ${statusTag("已跳过")}<span class="form-hint"> · ${esc(sk.reason)}${sk.force?"（强制）":""}</span></li>`;
    return `<li class="${done?"ok":isCur?"cur":"wait"}"><span class="dot"></span>${st}${hint}${done?" · 完成":isCur?" · 当前":""}</li>`;
  }).join("");
  const live = !t.voided && !t.withdrawn;
  const btns = [];
  if(currentRole==="ops" && live){
    const st = c.status;
    if(st==="渠道入网中"){
      const nxt = nextStep(pack, c);
      if(nxt==="商编/终端回写" || (nxt && !["协议签署","渠道送审","材料预检","内部审核"].includes(nxt) && !c.mid))
        btns.push(`<button class="btn btn-sm" onclick="openWriteback('${t.id}','${cid}')">录入商编回写</button>`);
      else if(["协议签署","渠道送审"].includes(nxt))
        btns.push(`<button class="btn btn-sm" onclick="demoAdvance('${t.id}','${cid}')">推进步骤</button>`);
    }
    if(st==="待认证授权") btns.push(`<button class="btn btn-sm" onclick="demoAdvance('${t.id}','${cid}')">确认认证完成</button>`);
    if(st==="待测试") btns.push(`<button class="btn btn-sm" onclick="demoAdvance('${t.id}','${cid}')">模拟测试通过</button>`);
    if(st==="待配置交接") btns.push(`<button class="btn btn-primary btn-sm" onclick="genHandoff('${t.id}','${cid}','config')">${hoFor(t.id,cid,"config")?"查看配置交接单":"发起配置交接"}</button>`);
    if(["配置已交接","运行态配置中"].includes(st)) btns.push(`<button class="btn btn-sm" onclick="demoRuntimeDone('${t.id}','${cid}')">模拟运行态配置完成</button>`);
    if(st==="待上线交接") btns.push(`<button class="btn btn-primary btn-sm" onclick="genHandoff('${t.id}','${cid}','golive')">${hoFor(t.id,cid,"golive")?"查看上线交接单":"发起上线交接"}</button>`);
    if(!["已交接","渠道终止","待补件","待审核","草稿"].includes(st))
      btns.push(`<button class="btn btn-sm" onclick="openSkip('${t.id}','${cid}')">跳过节点</button>`);
    if(["渠道入网中","待配置交接","配置已交接","待认证授权","待测试"].includes(st))
      btns.push(`<button class="btn btn-sm" onclick="openChReject('${t.id}','${cid}')">录入渠道驳回</button>`);
    if(!["已交接","渠道终止"].includes(st)) btns.push(`<button class="btn btn-sm" onclick="openTerminate('${t.id}','${cid}')">终止渠道</button>`);
  }
  if(["已交接","配置已交接","待上线交接","待认证授权","待测试"].includes(c.status) && ["ops","admin"].includes(currentRole)){
    if(hoFor(t.id,cid,"config")) btns.push(`<button class="btn btn-sm" onclick="go('handoffDetail','${hoFor(t.id,cid,"config").id}')">配置交接单</button>`);
    if(hoFor(t.id,cid,"golive")) btns.push(`<button class="btn btn-sm" onclick="go('handoffDetail','${hoFor(t.id,cid,"golive").id}')">上线交接单</button>`);
  }
  btns.push(`<button class="btn btn-sm" onclick="go('rules','${cid}')">规则包</button>`);
  const authHint = c.status==="待认证授权" ? `<div class="hint warn" style="margin-top:8px">通知对象为本单超管。本平台不伪造超管登录。${cid==="cmb"?"若由财务对接人办理，可转办或在已完成后跳过并记原因。":""}</div>` : "";
  return `<div class="channel-card ${cls}" ${c.status==="渠道终止"?'style="opacity:.75"':""}>
    <div class="hd"><strong>${pack.name}</strong>${statusTag(c.status)}</div>
    <div class="bd">
      <p class="form-hint" style="margin-bottom:8px">${esc(pack.note)}</p>
      ${c.terminated?`<div class="reason-line">已终止：${esc(c.terminated.reason)}（${esc(c.terminated.by)} · ${c.terminated.at}）</div>`:""}
      <ul class="mini-steps">${stepHtml}</ul>
      ${mats}
      ${c.mid?`<div class="kv-grid" style="margin-top:12px">
        ${c.mid?`<div class="kv"><div class="k">渠道商户号</div><div class="v">${c.mid}</div></div>`:""}
        ${c.term?`<div class="kv"><div class="k">终端号</div><div class="v">${c.term}</div></div>`:""}
        ${c.code?`<div class="kv"><div class="k">进件编码</div><div class="v">${c.code}</div></div>`:""}
        <div class="kv"><div class="k">密钥保管箱</div><div class="v">${c.vaulted?"已入箱（无明文）":"—"}</div></div>
      </div>`:""}
      ${c.chRejectRaw && currentRole!=="applicant"?`<p class="form-hint" style="margin-top:8px">渠道原文（内部）：${esc(c.chRejectRaw)}</p>`:""}
      <p class="form-hint" style="margin-top:10px">${esc(c.note)}</p>
      ${authHint}
      <div class="act-bar" style="margin-top:10px">${btns.join("")}</div>
    </div>
  </div>`;
}

function resolveHandoff(key){
  const raw = String(key||"");
  let h = handoffs.find(x=>x.id===raw);
  if(h) return h;
  const parts = raw.split("-");
  let kind = ["config","golive"].includes(parts[parts.length-1]) ? parts.pop() : null;
  const cid = parts.length>1 ? parts.pop() : null;
  const ticket = parts.join("-");
  if(!cid) return null;
  return kind ? hoFor(ticket, cid, kind) : hoFor(ticket, cid);
}
function pageHandoffDetail(key){

    kind = ["config","golive"].includes(parts[parts.length-1]) ? parts.pop() : null;
    cid = parts.length>1 ? parts.pop() : null;

  const t = tickets.find(x=>x.id===tid);
  if(!t || !cid || !t.channels[cid]) return `<div class="card card-body">未找到交接单</div>`;

      <div class="payload">${esc(JSON.stringify(payload, null, 2)).replace(excluded, `<span class="omit">${excluded}</span>`)}</div>

function wizBizValid(silent){

function wizCanLeave(step, silent){

  if(step===3 && !effChans().length){ if(!silent) toast("请至少选择一个没有冲突的渠道"); return false; }

function wizGo(n){

function submitWizard(){

  const chans = {};

      note: missing.length?("缺 "+missing.map(k=>p.materials.find(m=>m.key===k).name).join("、")):"资料已齐，待审核" };
  });
  const who = meName();
  const seq = tickets.filter(x=>x.id.startsWith("WN20261115")).length + 1;
  const nid = "WN20261115" + String(seq).padStart(3,"0");
  const at = nowStr();

    applicant: who, created:at, updated:at, submittedAt:at, reviewer:null, log:[], channels:chans,
    legalId: (wizard.legalId||"").trim(), taxNo: (wizard.taxNo||"").trim(),
    biz: {
      useDate: wizard.useDate, scene: wizard.scene, sceneOther: wizard.sceneOther||"",
      bizSys: wizard.bizSys, bizSysOther: wizard.bizSysOther||"",
      payMethods: (wizard.payMethods||[]).slice(), propCode: (wizard.propCode||"").trim(),
      applicantPhone: (wizard.applicantPhone||"").trim(), applicantEmail: (wizard.applicantEmail||"").trim(),
      adminSame: !!wizard.adminSame, adminName: (wizard.adminName||"").trim(),
      adminPhone: (wizard.adminPhone||"").trim(), adminEmail: (wizard.adminEmail||"").trim(),
      bankDirect: wizard.bankDirect, bankRoute: (wizard.bankRoute||"").trim(), mailAddr: (wizard.mailAddr||"").trim()
    } };
  tickets.unshift(t);
  logT(t, "发起申请", (roleMetaRaw().portal==="external"?"":"入网运营 "+who+" 代录，")+"渠道 "+ch.map(c=>rulePacks[c].short).join("、")+(skipped.length?"；查重跳过 "+skipped.map(c=>rulePacks[c].short).join("、"):""), who);
  if(Object.values(chans).some(c=>c.status==="待审核")) notify("reviewer", "新提交待认领 "+nid, store(wizard.storeId).name+" · "+ch.map(c=>rulePacks[c].short).join("、"), {page:"review"}, true);
  wizard.step = 1;
  toast("已创建主工单 "+nid+"，并按所选渠道生成子任务"+(skipped.length?"（已跳过有冲突的渠道）":""));

  if(!t) return true;

function extActions(t){
  const own = isOwner(t); const out = [];
  if(own && canWithdraw(t)) out.push(`<button class="btn" onclick="openWithdraw('${t.id}')">撤回申请</button>`);
  if(own && t.withdrawn){ out.push(`<button class="btn btn-primary" onclick="resubmitTicket('${t.id}')">重新提交</button>`); out.push(`<button class="btn" onclick="openVoid('${t.id}')">作废</button>`); }
  if(own && !t.withdrawn && !t.voided && isOpen(t) && !canWithdraw(t)) out.push(`<span class="lock-note">已有渠道通过内部审核或进入渠道环节，不能整单撤回；如需停止某个渠道，请联系入网运营终止。</span>`);
  if(!own && isOpen(t) && !t.withdrawn) out.push(`<span class="lock-note">申请人为 ${esc(t.applicant)}，撤回和作废需由申请人操作。</span>`);
  return out.join("");
}

  }).join("");
  return `
    <div class="hint">${ro?"申请已交接、终止或作废，材料只读。":"红色为该渠道仍缺或被退回的材料，下方写明退回原因；补齐后该渠道自动回到待审核。你看不到其他项目和内部审核记录。"}</div>
    <div class="channel-grid">${blocks}</div>`;
}

/* ========== 菜单、权限、外壳 ========== */
function personalItems(){ return [{ id:"notices", name:"消息中心", icon:"✉" }, { id:"me", name:"个人中心", icon:"☺" }]; }
function internalMenu(){
  const vault = hasVault() ? [{ id:"vault", name:"密钥保管箱", icon:"🔒" }] : [];
  if(currentRole==="admin") return [
    { group:"总览", items:[{ id:"workbench", name:"工作台", icon:"▣" }] },
    { group:"账号与授权", items:[{ id:"users", name:"账号与权限", icon:"♟" }] },
    { group:"主体与资料", items:[{ id:"enterprises", name:"企业管理", icon:"⌂" },{ id:"stores", name:"门店管理", icon:"☖" }] },
    { group:"规则与管治", items:[{ id:"rules", name:"渠道规则包", icon:"⚙" },{ id:"audit", name:"操作审计", icon:"◉" }, ...vault] },
    { group:"个人", items: personalItems() }
  ];
  if(currentRole==="reviewer") return [
    { group:"总览", items:[{ id:"workbench", name:"工作台", icon:"▣" }] },
    { group:"入网申请", items:[{ id:"review", name:"审核台", icon:"☑" },{ id:"tickets", name:"申请工单", icon:"☰" },{ id:"board", name:"进度看板", icon:"▦" }] },
    { group:"主体与资料", items:[{ id:"docs", name:"企业资料管理", icon:"▤" }] },
    { group:"规则", items:[{ id:"rules", name:"渠道规则包", icon:"⚙" }, ...vault] },
    { group:"个人", items: personalItems() }
  ];
  return [
    { group:"总览", items:[{ id:"workbench", name:"工作台", icon:"▣" }] },
    { group:"入网申请", items:[{ id:"tickets", name:"申请工单", icon:"☰" },{ id:"board", name:"进度看板", icon:"▦" }] },
    { group:"主体与资料", items:[{ id:"enterprises", name:"企业管理", icon:"⌂" },{ id:"stores", name:"门店管理", icon:"☖" },{ id:"accounts", name:"银行账户", icon:"¥" },{ id:"docs", name:"企业资料管理", icon:"▤" }] },
    { group:"渠道与凭证", items:[{ id:"tasks", name:"进件任务", icon:"⇄" },{ id:"auth", name:"协议授权", icon:"✎" }, ...vault] },
    { group:"交接与集成", items:[{ id:"handoff", name:"交接单", icon:"⇢" },{ id:"sync", name:"系统同步", icon:"↻" }] },
    { group:"规则与管治", items:[{ id:"rules", name:"渠道规则包", icon:"⚙" },{ id:"audit", name:"操作审计", icon:"◉" }] },
    { group:"个人", items: personalItems() }
  ];
}
function isInternal(){ return ["admin","reviewer","ops"].includes(currentRole); }
function currentMenu(){
  if(needsPhone()) return inviteEntry() ? [{ group:"申请门户", items:[{ id:"login", name:"登录", icon:"✆" }] }]
    : [{ group:"申请门户", items:[{ id:"login", name:"登录", icon:"✆" }, { id:"signup", name:"注册", icon:"✎" }] }];
  if(currentRole==="biz") return MENU_BIZ;
  if(isInternal()) return internalMenu();
  if(currentRole==="invitee" && !zhaoActivated) return [{ group:"申请门户", items:[{ id:"inviteActivate", name:"开通邀请", icon:"✎" }, { id:"notices", name:"消息中心", icon:"✉" }] }];
  if(currentRole==="registrant" && myReg.status!=="已通过") return [{ group:"申请门户", items:[{ id:"register", name: myReg.status==="未注册"?"注册账号":"注册审核状态", icon:"✎" }, { id:"notices", name:"消息中心", icon:"✉" }] }];
  if(currentRole==="field" || currentRole==="invitee" || currentRole==="registrant") return [
    { group:"申请门户", items:[
      { id:"extProject", name:"我的项目", icon:"▣" },
      { id:"ticketNew", name:"发起申请", icon:"＋" },
      { id:"extDocs", name:"资料补传", icon:"▤" },
      { id:"extProgress", name:"申请进度", icon:"☰" }
    ]},
    { group:"个人", items: personalItems() }
  ];
  if(currentRole==="applicant") return [MENU_EXT[0], { group:"个人", items: personalItems() }];
  return internalMenu();
}
const INTERNAL_EXTRA = { admin:["ticket"], reviewer:["ticket"], ops:["ticket","ticketNew","handoffDetail"] };
function isAllowed(page){
  const ids = currentMenu().flatMap(g=>g.items.map(i=>i.id));
  if(isInternal()) return ids.includes(page) || INTERNAL_EXTRA[currentRole].includes(page);
  if(needsPhone()) return page==="login" || (page==="signup" && !inviteEntry());
  if(currentRole==="applicant") return ids.includes(page) || (page==="ticket" && myTickets().some(x=>x.id===route.id));
  if(currentRole==="registrant" && myReg.status!=="已通过") return page==="register" || page==="notices";
  if(currentRole==="field" || currentRole==="registrant" || (currentRole==="invitee" && zhaoActivated))
    return ids.includes(page) || (page==="ticket" && myTickets().some(x=>x.id===route.id));
  if(currentRole==="invitee") return page==="inviteActivate" || page==="notices";
  if(currentRole==="biz") return ids.includes(page);
  return false;
}
function switchRole(role, page){
  currentRole = role;
  pv = { sent:false, phone:"", agree:false };
  if(role!=="applicant") extViewTicket = null;
  ensureWizardScope(true);
  const m = roleMeta();
  const next = page || defaultPage();
  if(next==="ticket" && m.ticket) go("ticket", m.ticket);
  else go(next);
  const msg = {
    admin:"已切换到平台管理员李敏：管账号、授权、邀请和注册审批",
    reviewer:"已切换到审核员张航：认领后审核，可指派、转审或退回补件",
    ops:"已切换到入网运营何畅：渠道任务、回写、渠道驳回和按渠道交接",
    field:"已进入林峰的申请门户：平台已开通发起权，范围仅限湾区商业",
    applicant:"已进入申请门户，仅能处理被邀请的本项目",
    invitee: zhaoActivated?"已进入赵启的申请门户，可在授权范围内发起申请":"正在预览赵启收到的开通邀请，确认后才会获得提交权限",
    registrant: myReg.status==="已通过"?"钱程注册已审核通过，可在授权范围内发起申请":myReg.status==="待审核"?"钱程已注册，等待平台审核，审核前不能提交申请":myReg.status==="已驳回"?"钱程注册被驳回，可修改资料重新提交":"进入自助注册：先验证手机号，再提交平台审核",
    biz:"已进入业务平台示意页，申请侧权限已收回为只读"
  }[role];
  toast(needsPhone() ? (inviteEntry() ? "通过邀请链接进入：先用邀请登记的手机号登录，验证后才显示邀请和项目内容" : role==="guest" ? "统一登录入口：输入手机号和验证码，系统按账号状态自动分流" : "请先登录申请门户") : (msg||""));
}
function renderChrome(){
  const m = roleMeta();
  document.body.classList.toggle("portal-ext", m.portal==="external");
  document.body.classList.toggle("portal-biz", m.portal==="business");
  const logo = m.portal==="external"
    ? `<div class="logo-mark">申请</div><div>入网申请门户<div class="logo-sub">${currentRole==="field"|| (currentRole==="invitee"&&zhaoActivated) || (currentRole==="registrant"&&myReg.status==="已通过")?"授权范围内提交":currentRole==="registrant"?"自助注册 · 审核后生效":"仅本项目 · 提交与补件"}</div></div>`
    : m.portal==="business"
    ? `<div class="logo-mark">业务</div><div>原商户业务平台<div class="logo-sub">示意 · 运行态，与申请隔离</div></div>`
    : `<div class="logo-mark">入网</div><div>商户入网申请平台<div class="logo-sub">申请态 · ${esc(m.sub)}</div></div>`;
  $("logoBox").innerHTML = needsPhone()
    ? `<div class="logo-mark">申请</div><div>入网申请门户<div class="logo-sub">安全验证</div></div>` : logo;
  document.body.classList.toggle("auth-mode", needsPhone());
  $("bannerText").textContent = needsPhone()
    ? "统一登录 · 手机号＋短信验证码登录或注册，验证通过前不展示主体、项目、资料和邀请内容"
    : currentRole==="registrant"
    ? (myReg.status==="已通过"?"申请门户 · 钱程注册已审核通过，可在滨江物业范围内发起申请":"自助注册 · 手机号验证为第一层核验，统一用户中心为第二层参考，平台审核通过后才生效")
    : currentRole==="field"
    ? "申请门户 · 林峰已由平台开通「可发起申请」，范围仅限湾区商业，无审核台和保管箱"
    : currentRole==="invitee" && !zhaoActivated
    ? "邀请开通 · 一线凭平台邀请开通申请门户账号，这不是业务平台账号"
    : currentRole==="invitee"
    ? "申请门户 · 赵启已开通，可在滨江物业范围内发起申请"
    : currentRole==="applicant"
    ? "申请门户 · 周宁仅能查看并补传本项目资料，不能进入审核台或保管箱"
    : m.portal==="business"
    ? "业务平台示意 · 与周宁申请门户是同一人，权限按运行态单独授予"
    : currentRole==="admin"
    ? "平台管理员 · 管账号、授权、邀请与注册审批，不进审核台和渠道任务；保管箱需单独授权"
    : currentRole==="reviewer"
    ? "审核员 · 只处理审核台：认领、指派、转审、通过或按原因库退回补件"
    : "入网运营 · 渠道任务、回写、渠道驳回录入与按渠道交接"+(hasVault()?"；保管箱已单独授权":"");
  const showBell = !needsPhone() && currentRole!=="biz" && currentRole!=="guest";
  const n = showBell ? unreadCount() : 0;
  $("headerRight").innerHTML = `
    <div class="role-switch">
      <span>演示身份</span>
      <select onchange="switchRole(this.value)">
        <option value="admin" ${currentRole==="admin"?"selected":""}>内部 · 平台管理员（李敏）</option>
        <option value="reviewer" ${currentRole==="reviewer"?"selected":""}>内部 · 审核员（张航）</option>
        <option value="ops" ${currentRole==="ops"?"selected":""}>内部 · 入网运营（何畅）</option>
        <option value="field" ${currentRole==="field"?"selected":""}>一线 · 林峰（已授权发起）</option>
        <option value="applicant" ${currentRole==="applicant"?"selected":""}>外部 · 周宁（项目申请人）</option>
        <option value="registrant" ${currentRole==="registrant"?"selected":""}>一线 · 钱程（自助注册）</option>
        <option value="invitee" ${currentRole==="invitee"?"selected":""}>一线 · 赵启（邀请开通）</option>
        <option value="guest" ${currentRole==="guest"?"selected":""}>外部 · 访客（统一登录入口）</option>
        <option value="biz" ${currentRole==="biz"?"selected":""}>同一人 · 周宁（业务经办）</option>
      </select>
      ${showBell?`<a class="bell" id="bell" onclick="go('notices')" title="消息中心">✉${n?`<b>${n}</b>`:""}</a>`:""}
    </div>
    <span>${esc(m.name)} · ${esc(m.sub)}</span>
    <div class="avatar">${m.avatar}</div>
    ${m.portal==="external" && !needsPhone() ? `<button class="btn btn-sm" onclick="logout()">退出</button>` : ""}`;
}
function renderMenu(){
  const n = unreadCount();
  $("menu").innerHTML = currentMenu().map(g =>
    `<div class="menu-group-title">${g.group}</div>` +
    g.items.map(it => `<div class="menu-item ${route.page===it.id?"active":""}" onclick="go('${it.id}')"><span class="icon">${it.icon}</span>${it.name}${it.id==="notices"&&n?`<span class="menu-badge">${n}</span>`:""}</div>`).join("")
  ).join("");
}


function render(){
  document.body.classList.remove("nav-open");
  tickets.forEach(t=>{ t.overall = computeOverall(t); });
  refreshInvites();
  if(!isAllowed(route.page)) { route = { page: defaultPage(), id: null }; }
  renderChrome();
  renderMenu();
  const p = route.page, id=route.id;
  let html="";
  if(p==="workbench") html=pageWorkbench();
  else if(p==="tickets") html=pageTickets();
  else if(p==="ticket") html=pageTicket(id);
  else if(p==="ticketNew") html=pageTicketNew();
  else if(p==="review") html=pageReview();
  else if(p==="board") html=pageBoard();
  else if(p==="enterprises") html=pageEntities("enterprises");
  else if(p==="stores") html=pageEntities("stores");
  else if(p==="accounts") html=pageEntities("accounts");
  else if(p==="docs") html=pageDocs();
  else if(p==="tasks") html=pageTasks();
  else if(p==="auth") html=pageAuth();
  else if(p==="vault") html=pageVault();
  else if(p==="handoff") html=pageHandoff();
  else if(p==="handoffDetail") html=pageHandoffDetail(id);
  else if(p==="sync") html=pageSync();
  else if(p==="rules") html=pageRules(id);
  else if(p==="users") html=pageUsers();
  else if(p==="inviteActivate") html=pageInviteActivate();
  else if(p==="register") html=pageRegister();
  else if(p==="login") html=pageLogin("login");
  else if(p==="signup") html=pageLogin("signup");
  else if(p==="audit") html=pageAudit();
  else if(p==="extProject") html=pageExtProject();
  else if(p==="extDocs") html=pageExtDocs();
  else if(p==="extProgress") html=pageExtProgress();
  else if(p==="bizHome") html=pageBizHome();
  else if(p==="notices") html=pageNotices();
  else if(p==="me") html=pageMe();
  else html=pageWorkbench();
  $("app").innerHTML = html;
}
if(location.hash){
  const p=location.hash.replace(/^#\//,"").split("/");
  route={page:p[0]||"workbench", id:p[1]||null};
}
resetWizardBiz();
render();
</script>
